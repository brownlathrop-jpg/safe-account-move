name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (standalone)
        run: bunx vite build --config vite.config.standalone.ts

      - name: Show output
        run: |
          ls -la
          ls -la dist || echo "dist missing"
          ls -la dist/server || echo "dist/server missing"

      - name: Prepare archive
        run: tar -czf deploy.tar.gz dist selfhost sql scripts

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: /tmp/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=/home/crmadmin/htdocs/crm.skladnow.ru
            cd "$APP"
            STAMP=$(date +%s)
            cp -a dist "dist.prev-$STAMP"
            tar -xzf /tmp/deploy.tar.gz
            rm -f /tmp/deploy.tar.gz
            chown -R crmdeploy:crmadmin dist scripts selfhost sql
            set -a
            . ./.env
            set +a
            node scripts/migrate.mjs
            sudo -u crmdeploy pm2 restart crm
            sleep 3
            if ! curl -sf -o /dev/null http://127.0.0.1:3001; then
              echo "Health check failed on :3001, rolling back"
              rm -rf dist
              mv "dist.prev-$STAMP" dist
              sudo -u crmdeploy pm2 restart crm
              exit 1
            fi
            echo "Deploy complete, health check OK on :3001"
